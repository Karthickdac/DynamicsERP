components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    UserRole:
      type: string
      enum: [admin, sales, project_manager, finance, service, engineer]

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        avatarUrl: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        employeeCode: { type: ["string", "null"] }
        isActive: { type: boolean }
        staffId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, email, firstName, lastName, role, isActive, createdAt]

    UserInput:
      type: object
      properties:
        email: { type: string }
        password: { type: ["string", "null"], minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        phone: { type: ["string", "null"] }
        designation: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        employeeCode: { type: ["string", "null"] }
        isActive: { type: boolean }
        staffId: { type: ["integer", "null"] }
      required: [email, firstName, lastName, role]

    ResetPasswordInput:
      type: object
      properties:
        password: { type: string, minLength: 8 }
      required: [password]

    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    RegisterInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
      required: [email, password, firstName, lastName]

    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
      required: [user]

    Account:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        industry: { type: ["string", "null"] }
        gstin: { type: ["string", "null"] }
        billingAddress: { type: ["string", "null"] }
        billingCity: { type: ["string", "null"] }
        billingState: { type: ["string", "null"] }
        billingPincode: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        accountType: { type: string, enum: [residential, commercial, industrial, government] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, name, accountType, createdAt]

    AccountInput:
      type: object
      properties:
        name: { type: string }
        industry: { type: ["string", "null"] }
        gstin: { type: ["string", "null"] }
        billingAddress: { type: ["string", "null"] }
        billingCity: { type: ["string", "null"] }
        billingState: { type: ["string", "null"] }
        billingPincode: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        accountType: { type: string, enum: [residential, commercial, industrial, government] }
        notes: { type: ["string", "null"] }
      required: [name, accountType]

    Contact:
      type: object
      properties:
        id: { type: integer }
        accountId: { type: ["integer", "null"] }
        firstName: { type: string }
        lastName: { type: string }
        title: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, firstName, lastName, isPrimary, createdAt]

    ContactInput:
      type: object
      properties:
        accountId: { type: ["integer", "null"] }
        firstName: { type: string }
        lastName: { type: string }
        title: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isPrimary: { type: boolean }
      required: [firstName, lastName]

    LeadStatus:
      type: string
      enum: [new, qualified, proposal, negotiation, won, lost]

    LeadSource:
      type: string
      enum: [website, referral, walk_in, exhibition, cold_call, partner, social_media, other]

    Lead:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        accountId: { type: ["integer", "null"] }
        accountName: { type: ["string", "null"] }
        contactId: { type: ["integer", "null"] }
        contactName: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/LeadStatus" }
        source: { $ref: "#/components/schemas/LeadSource" }
        capacityKwp: { type: ["number", "null"] }
        estimatedValue: { type: ["number", "null"] }
        expectedCloseDate: { type: ["string", "null"], format: date }
        assignedToId: { type: ["integer", "null"] }
        assignedToName: { type: ["string", "null"] }
        siteAddress: { type: ["string", "null"] }
        siteCity: { type: ["string", "null"] }
        siteState: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, title, status, source, createdAt, updatedAt]

    LeadInput:
      type: object
      properties:
        title: { type: string }
        accountId: { type: ["integer", "null"] }
        contactId: { type: ["integer", "null"] }
        status: { $ref: "#/components/schemas/LeadStatus" }
        source: { $ref: "#/components/schemas/LeadSource" }
        capacityKwp: { type: ["number", "null"] }
        estimatedValue: { type: ["number", "null"] }
        expectedCloseDate: { type: ["string", "null"], format: date }
        assignedToId: { type: ["integer", "null"] }
        siteAddress: { type: ["string", "null"] }
        siteCity: { type: ["string", "null"] }
        siteState: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required: [title, status, source]

    LeadPipelineStage:
      type: object
      properties:
        status: { $ref: "#/components/schemas/LeadStatus" }
        count: { type: integer }
        totalValue: { type: number }
      required: [status, count, totalValue]

    LeadActivityType:
      type: string
      enum: [note, call, email, meeting, status_change, assignment]

    LeadActivity:
      type: object
      properties:
        id: { type: integer }
        leadId: { type: integer }
        type: { $ref: "#/components/schemas/LeadActivityType" }
        title: { type: string }
        description: { type: ["string", "null"] }
        userId: { type: ["integer", "null"] }
        userName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, leadId, type, title, createdAt]

    LeadActivityInput:
      type: object
      properties:
        type: { $ref: "#/components/schemas/LeadActivityType" }
        title: { type: string }
        description: { type: ["string", "null"] }
      required: [type, title]

    DashboardSummary:
      type: object
      properties:
        activeLeads: { type: integer }
        qualifiedLeads: { type: integer }
        wonThisMonth: { type: integer }
        pipelineValue: { type: number }
        totalAccounts: { type: integer }
        totalContacts: { type: integer }
        winRate: { type: number }
        leadsBySource:
          type: array
          items:
            type: object
            properties:
              source: { $ref: "#/components/schemas/LeadSource" }
              count: { type: integer }
            required: [source, count]
