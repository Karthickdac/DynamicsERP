openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DynamicsERP API specification — Solar Projects ERP
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: accounts
  - name: contacts
  - name: leads
  - name: lead-activities
  - name: dashboard
  - name: products
  - name: quotations
  - name: estimations
  - name: approvals
  - name: sales-orders
  - name: projects
  - name: project-milestones
  - name: project-tasks
  - name: project-team
  - name: site-surveys
  - name: service-tickets
  - name: service-visits
  - name: amc-contracts
  - name: company-settings
  - name: staff
  - name: email-templates
  - name: emails
  - name: integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ===== Auth =====
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===== Users =====
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: updateUser
      tags: [users]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
    delete:
      operationId: deleteUser
      tags: [users]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }
  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResetPasswordInput" } } } }
      responses:
        "204": { description: Password reset }

  # ===== Accounts (companies) =====
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    patch:
      operationId: updateAccount
      tags: [accounts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
    delete:
      operationId: deleteAccount
      tags: [accounts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  # ===== Contacts =====
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      parameters:
        - in: query
          name: accountId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
    post:
      operationId: createContact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    patch:
      operationId: updateContact
      tags: [contacts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
    delete:
      operationId: deleteContact
      tags: [contacts]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  # ===== Leads =====
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: assignedTo
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    patch:
      operationId: updateLead
      tags: [leads]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
    delete:
      operationId: deleteLead
      tags: [leads]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /leads/pipeline:
    get:
      operationId: getLeadPipeline
      tags: [leads]
      summary: Lead counts and value grouped by status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadPipelineStage" }

  # ===== Lead Activities =====
  /leads/{leadId}/activities:
    get:
      operationId: listLeadActivities
      tags: [lead-activities]
      parameters:
        - in: path
          name: leadId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadActivity" }
    post:
      operationId: createLeadActivity
      tags: [lead-activities]
      parameters:
        - in: path
          name: leadId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadActivityInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadActivity" }

  # ===== Dashboard =====
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: KPI numbers for the home dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed across modules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityItem" }

  # ===== Products / Catalog =====
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } }
    post:
      operationId: createProduct
      tags: [products]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: updateProduct
      tags: [products]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }

  # ===== Quotations =====
  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: leadId, schema: { type: integer } }
        - { in: query, name: accountId, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Quotation" } } } } }
    post:
      operationId: createQuotation
      tags: [quotations]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationDetail" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: updateQuotation
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }
  /quotations/{id}/line-items:
    post:
      operationId: addQuotationLineItem
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationLineItemInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationLineItem" } } } }
  /quotations/{id}/line-items/{itemId}:
    patch:
      operationId: updateQuotationLineItem
      tags: [quotations]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: itemId, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationLineItemInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/QuotationLineItem" } } } }
    delete:
      operationId: deleteQuotationLineItem
      tags: [quotations]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: itemId, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
  /quotations/{id}/submit:
    post:
      operationId: submitQuotation
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
  /quotations/{id}/send:
    post:
      operationId: sendQuotation
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
  /quotations/{id}/mark-won:
    post:
      operationId: markQuotationWon
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
  /quotations/{id}/mark-lost:
    post:
      operationId: markQuotationLost
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quotation" } } } }
  /quotations/{id}/convert-to-order:
    post:
      operationId: convertQuotationToOrder
      tags: [quotations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SalesOrder" } } } }

  # ===== Estimations =====
  /estimations:
    get:
      operationId: listEstimations
      tags: [estimations]
      parameters:
        - { in: query, name: leadId, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Estimation" } } } } }
    post:
      operationId: createEstimation
      tags: [estimations]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EstimationInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Estimation" } } } }
  /estimations/{id}:
    get:
      operationId: getEstimation
      tags: [estimations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Estimation" } } } }
    patch:
      operationId: updateEstimation
      tags: [estimations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EstimationInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Estimation" } } } }
    delete:
      operationId: deleteEstimation
      tags: [estimations]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }

  # ===== Approval Workflow =====
  /approval-rules:
    get:
      operationId: listApprovalRules
      tags: [approvals]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApprovalRule" } } } } }
    post:
      operationId: createApprovalRule
      tags: [approvals]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRuleInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRule" } } } }
  /approval-rules/{id}:
    patch:
      operationId: updateApprovalRule
      tags: [approvals]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRuleInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRule" } } } }
    delete:
      operationId: deleteApprovalRule
      tags: [approvals]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Deleted }
  /approval-requests:
    get:
      operationId: listApprovalRequests
      tags: [approvals]
      parameters:
        - { in: query, name: assignedToMe, schema: { type: boolean } }
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } } } } }
  /approval-requests/{id}/approve:
    post:
      operationId: approveApprovalRequest
      tags: [approvals]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalActionInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
  /approval-requests/{id}/reject:
    post:
      operationId: rejectApprovalRequest
      tags: [approvals]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalActionInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }

  # ===== Sales Orders =====
  /sales-orders:
    get:
      operationId: listSalesOrders
      tags: [sales-orders]
      parameters:
        - { in: query, name: status, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SalesOrder" } } } } }
  /sales-orders/{id}:
    get:
      operationId: getSalesOrder
      tags: [sales-orders]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SalesOrder" } } } }
    patch:
      operationId: updateSalesOrder
      tags: [sales-orders]
      parameters: [{ in: path, name: id, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SalesOrderUpdate" } } } }
